<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fff8ec;
    --ink: #1f1a2e;
    --muted: #8a8196;
    --red: #ff6b6b;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Fredoka', sans-serif;
    min-height: 100vh;
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 4px;
  }

  header .icon {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
  }

  header h1 {
    font-family: 'Fredoka', sans-serif;
    font-weight: 500;
    font-size: 28px;
    margin: 0;
  }

  .subtitle {
    color: var(--muted);
    font-size: 15px;
    margin: 4px 0 28px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }

  @media (min-width: 640px) {
    .grid {
      grid-template-columns: repeat(5, 1fr);
      gap: 18px;
    }
  }

  .tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 14px 8px 12px;
    background: #fff;
    border: 3px solid var(--ink);
    border-bottom-width: 6px;
    border-radius: 18px;
    text-decoration: none;
    color: var(--ink);
    text-align: center;
    cursor: pointer;
    min-height: 44px;
    transition: transform 0.05s ease;
    position: relative;
  }

  a.tile:active {
    transform: translateY(2px);
    border-bottom-width: 4px;
  }

  .tile:focus-visible {
    outline: 3px solid var(--red);
    outline-offset: 2px;
  }

  .tile.soon {
    opacity: 0.55;
    cursor: default;
  }

  .tile-icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--ink);
  }

  .tile-icon svg {
    width: 30px;
    height: 30px;
  }

  .tile-name {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.2;
  }

  .tile-played {
    font-size: 11px;
    color: var(--muted);
  }

  .soon-tag {
    position: absolute;
    top: 6px;
    right: 6px;
    background: var(--ink);
    color: var(--cream);
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 999px;
    text-transform: none;
  }

  .more-strip {
    margin-top: 28px;
    border: 2px dashed var(--muted);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <span class="icon" id="header-icon"></span>
    <h1>Les Games</h1>
  </header>
  <p class="subtitle">Pick a game and go.</p>

  <div class="grid" id="grid"></div>

  <div class="more-strip">More games on the way</div>
</div>

<script>
  // How to add a game:
  // 1. Copy one of the entries below.
  // 2. Give it a short unique id, its real name, and the web address (url) where it lives.
  // 3. Pick a color (any hex code) and an icon key from the ICONS object further down.
  // 4. Set status to "live" once it has a real url, or "soon" if it is not ready yet.
  // A game with status "soon" is shown faded and cannot be tapped, no matter what url it has.
  const GAMES = [
    { id: 'sudoku', name: 'Wolf Sudoku', url: '', color: '#5b8def', icon: 'grid', status: 'soon' },
    { id: 'saloon', name: 'Saloon Defense', url: '', color: '#f28c38', icon: 'saloon', status: 'soon' },
    // Temporary entry for testing tap and last-played behavior. DELETE IN PHASE 2.
    { id: 'test', name: 'Test game', url: 'https://example.com', color: '#6fcf97', icon: 'fallback', status: 'live' },
  ];

  const ICONS = {
    grid: `<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="4" y="4" width="10" height="10" rx="2" stroke="#1f1a2e" stroke-width="2.5"/>
      <rect x="15" y="4" width="10" height="10" rx="2" stroke="#1f1a2e" stroke-width="2.5"/>
      <rect x="26" y="4" width="10" height="10" rx="2" stroke="#1f1a2e" stroke-width="2.5"/>
      <rect x="4" y="15" width="10" height="10" rx="2" stroke="#1f1a2e" stroke-width="2.5"/>
      <rect x="15" y="15" width="10" height="10" rx="2" fill="#f2c94c" stroke="#1f1a2e" stroke-width="2.5"/>
      <rect x="26" y="15" width="10" height="10" rx="2" stroke="#1f1a2e" stroke-width="2.5"/>
      <rect x="4" y="26" width="10" height="10" rx="2" stroke="#1f1a2e" stroke-width="2.5"/>
      <rect x="15" y="26" width="10" height="10" rx="2" stroke="#1f1a2e" stroke-width="2.5"/>
      <rect x="26" y="26" width="10" height="10" rx="2" stroke="#1f1a2e" stroke-width="2.5"/>
    </svg>`,
    saloon: `<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M6 14 L20 6 L34 14" stroke="#1f1a2e" stroke-width="2.5" stroke-linejoin="round" fill="none"/>
      <rect x="6" y="14" width="28" height="20" rx="2" stroke="#1f1a2e" stroke-width="2.5"/>
      <path d="M14 20 C14 20 15 24 14 28" stroke="#1f1a2e" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M26 20 C26 20 25 24 26 28" stroke="#1f1a2e" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="12" y1="19" x2="18" y2="19" stroke="#1f1a2e" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="22" y1="19" x2="28" y2="19" stroke="#1f1a2e" stroke-width="2.5" stroke-linecap="round"/>
    </svg>`,
    controller: `<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M11 14 H29 C34 14 37 18 36 24 C35 29 31 30 28 27 L26 25 H14 L12 27 C9 30 5 29 4 24 C3 18 6 14 11 14 Z" fill="#ff6b6b" stroke="#1f1a2e" stroke-width="2.5" stroke-linejoin="round"/>
      <line x1="12" y1="20" x2="12" y2="24" stroke="#1f1a2e" stroke-width="2" stroke-linecap="round"/>
      <line x1="10" y1="22" x2="14" y2="22" stroke="#1f1a2e" stroke-width="2" stroke-linecap="round"/>
      <circle cx="27" cy="19" r="1.5" fill="#1f1a2e"/>
      <circle cx="31" cy="22" r="1.5" fill="#1f1a2e"/>
    </svg>`,
    fallback: `<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="15" stroke="#1f1a2e" stroke-width="2.5"/>
      <text x="20" y="26" font-family="Fredoka, sans-serif" font-size="18" font-weight="600" fill="#1f1a2e" text-anchor="middle">?</text>
    </svg>`,
  };

  const STORAGE_KEY = 'les-games:lastPlayed';

  function readLastPlayed() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function writeLastPlayed(id) {
    try {
      const data = readLastPlayed();
      data[id] = Date.now();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) {
      // Storage failed; page still works, just without memory of last played.
    }
  }

  function formatLastPlayed(timestamp) {
    if (!timestamp) return 'New';
    const diffMs = Date.now() - timestamp;
    const minutes = Math.floor(diffMs / 60000);
    if (minutes < 60) return 'Just now';
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return hours + 'h ago';
    const days = Math.floor(hours / 24);
    return days + 'd ago';
  }

  function sortGames(games, lastPlayed) {
    const live = games.filter(g => g.status === 'live');
    const soon = games.filter(g => g.status !== 'live');

    const played = live.filter(g => lastPlayed[g.id]);
    const unplayed = live.filter(g => !lastPlayed[g.id]);
    played.sort((a, b) => lastPlayed[b.id] - lastPlayed[a.id]);

    return [...played, ...unplayed, ...soon];
  }

  function renderTile(game, lastPlayed) {
    const isLive = game.status === 'live';
    const icon = ICONS[game.icon] || ICONS.fallback;
    const tag = document.createElement(isLive ? 'a' : 'div');
    tag.className = 'tile' + (isLive ? '' : ' soon');

    if (isLive) {
      tag.href = game.url;
      tag.addEventListener('click', () => writeLastPlayed(game.id));
    } else {
      const soonTag = document.createElement('span');
      soonTag.className = 'soon-tag';
      soonTag.textContent = 'Soon';
      tag.appendChild(soonTag);
    }

    const iconBox = document.createElement('span');
    iconBox.className = 'tile-icon';
    iconBox.style.background = game.color;
    iconBox.innerHTML = icon;
    tag.appendChild(iconBox);

    const name = document.createElement('span');
    name.className = 'tile-name';
    name.textContent = game.name;
    tag.appendChild(name);

    const played = document.createElement('span');
    played.className = 'tile-played';
    played.textContent = isLive ? formatLastPlayed(lastPlayed[game.id]) : '';
    tag.appendChild(played);

    if (isLive) {
      tag.setAttribute('tabindex', '0');
    }

    return tag;
  }

  function render() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    const lastPlayed = readLastPlayed();
    const ordered = sortGames(GAMES, lastPlayed);
    ordered.forEach(game => grid.appendChild(renderTile(game, lastPlayed)));
  }

  document.getElementById('header-icon').innerHTML = ICONS.controller;
  render();
</script>
</body>
</html>
